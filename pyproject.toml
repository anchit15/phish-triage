[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-triage"
version = "0.1.0"
description = "Classify a suspicious URL, find abuse contacts and draft a takedown notice."
license = "MIT"
authors = [{ name = "John Anchit" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1",
    "scikit-learn>=1.9",
    "shap>=0.51",
    "joblib>=1.6",
    "tldextract>=5.4",
    "dnspython>=2.9",
    "cryptography>=50.0",
    "requests>=2.34",
    "typer>=0.29",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.17"]

[project.scripts]
phish-triage = "phish_triage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
